[project]
name = "levelupdiag-kristal"
version = "0.3.0"
description = "External deep conformance and adversarial validation harness for Kristal Framework"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.22,<5",
]

[project.optional-dependencies]
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.5,<10",
]

[tool.levelupdiag]
mode = "external-target-harness"
default_target = "../kristal-framework"
